# Restrict crm-api's bot-facing internal endpoints to the private network.
#
# These routes are `@Unprotected()` (no Keycloak guard) because they are called
# by crm-bot service-to-service:
#   POST /api/v1/bot-callback/reply     — bot results injected into conversations
#   GET  /api/v1/internal/channels      — channel list for a tenant
#   GET  /api/v1/internal/agents        — agent picker for the Handoff block
#   GET  /api/v1/internal/groups        — group picker for the Handoff block
#
# They validate a shared secret (fail-closed), but a shared secret is one string.
# Keeping them off the public internet means a leaked secret is not, by itself,
# cross-tenant message injection.
#
# Install on Node A:
#   1. copy to /etc/nginx/snippets/crm-api-internal-allowlist.conf
#   2. in the `server { }` block for api.crmsaudi.dev, add:
#          include snippets/crm-api-internal-allowlist.conf;
#      BEFORE the generic `location / { proxy_pass ... }` block
#   3. nginx -t && systemctl reload nginx
#
# Verify from outside the VPC (expect 403):
#   curl -s -o /dev/null -w '%{http_code}\n' -X POST https://api.crmsaudi.dev/api/v1/bot-callback/reply

location ~ ^/api/v1/(bot-callback|internal)/ {
    # New-infra VPC: Node A .2, Node C .3, Node D .4, Node B .5
    allow 10.104.0.0/20;
    allow 172.16.0.0/12;
    allow 127.0.0.1;
    deny all;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
